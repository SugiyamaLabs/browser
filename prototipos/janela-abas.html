<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abas, sono e páginas internas</title>
<style>
/* tokens de janela.html (Grafite), um para um; modo claro idem */
:root{--bg:#0B0B0D;--side:#111114;--raise:#16161A;--sunk:#0F0F12;--line:#24242A;--line-strong:#3A3A42;--ink:#F2F2F4;--mute:#9A9AA4;--dim:#8A8A94;--hi:#F4F4F6;--warn:#F2C14E;
 --hover:#18181C;--hover-2:#1B1B20;--float:#1A1A1F;--raise-2:#26262D;--line-hover:#4A4A54;--on-hi:#0B0B0D;--light-2:#FFE9C7;--light-3:#FFC98A;--light-4:#F7A95C;
 --ui:-apple-system,"SF Pro Text",BlinkMacSystemFont,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
 --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--d:.2s;--lift:0 10px 24px rgba(0,0,0,.45)}
:root[data-mode="light"]{--bg:#FAFAFB;--side:#F1F1F4;--raise:#FFFFFF;--sunk:#E9E9ED;--line:#E0E0E5;--line-strong:#CFCFD6;--line-hover:#B9B9C2;
 --ink:#16161A;--mute:#5C5C66;--dim:#71717B;--hi:#16161A;--on-hi:#FFFFFF;--hover:#E8E8EC;--hover-2:#E4E4E9;--float:#FFFFFF;--raise-2:#E2E2E7;--light-2:#F7A95C;--light-3:#E8893A;--lift:0 10px 24px rgba(0,0,0,.14)}
:root[data-mode="light"] .lights i{background:#D4D4DA}
.mark-light{display:none!important}:root[data-mode="light"] .mark-light{display:block!important}:root[data-mode="light"] .mark-dark{display:none!important}
/* Reduzir movimento: nada anda (visual.md, princípio 6) */
:root.rm *,:root.rm *::before,:root.rm *::after{animation:none!important;transition:none!important}
*{box-sizing:border-box;scrollbar-width:none}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--light-2);outline-offset:2px;border-radius:8px}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
kbd,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
kbd{font-size:11.5px;padding:2px 5px;border-radius:5px;background:var(--raise-2);color:var(--mute)}
main{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
header{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}header>div{flex:1;min-width:260px}
header h1{font-size:20px;margin:0 0 4px}header p{margin:0;color:var(--dim);max-width:80ch;font-size:13px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px}
.seg button{height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.switch{width:36px;height:22px;border-radius:11px;background:var(--raise-2);border:1px solid var(--line-strong);position:relative;flex:none;transition:background .2s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .2s var(--spring),background .2s}
.switch[aria-checked="true"]{background:var(--hi);border-color:var(--hi)}.switch[aria-checked="true"]::after{transform:translateX(14px);background:var(--on-hi)}
.topnav{display:flex;gap:4px;flex-wrap:wrap;margin:22px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topnav button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--mute)}
.topnav button:hover{background:var(--hover);color:var(--ink)}
.topnav button[aria-current="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.cap{color:var(--dim);font-size:12.5px;margin:0 0 10px;max-width:90ch}
.states{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.states button{height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.states button:hover{border-color:var(--line-strong);color:var(--ink)}
.states button[aria-pressed="true"]{background:var(--raise);border-color:var(--light-3);color:var(--ink)}
.states .play{border-color:var(--line-strong);color:var(--ink)}
.note{color:var(--dim);font-size:12.5px;margin:10px 0 0;max-width:90ch}
/* ===== Janela ===== */
.win{position:relative;height:540px;border:1px solid var(--line);border-radius:12px;background:var(--side);display:flex;flex-direction:column;min-width:0}
.lights{display:flex;gap:8px;padding:0 10px 0 16px;flex:none}.lights i{width:12px;height:12px;border-radius:50%;background:#2A2A30}
.bar{display:flex;align-items:center;gap:2px;padding:10px 14px 10px 0;flex:none}
.tb{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim);flex:none}.tb:hover{background:var(--raise);color:var(--ink)}
.omni{flex:1;min-width:0;height:34px;margin:0 8px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden}
.omni b{font-weight:400;color:var(--ink)}
.loadbar{height:2px;margin:0 14px;position:relative;overflow:hidden;flex:none}
.loading .loadbar::after{content:"";position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,var(--light-3),transparent);animation:load 1.1s var(--ease) infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.body{flex:1;display:flex;gap:10px;padding:0 14px 14px;min-height:0}
.sb{width:236px;flex:none;display:flex;flex-direction:column;gap:2px;min-width:0;transition:width var(--d) var(--ease);position:relative}
.col .sb{width:40px}
.space-title{display:flex;align-items:center;gap:9px;padding:6px 8px 8px;font-size:13px;font-weight:600;white-space:nowrap;min-width:0}
.logo{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font:700 10px/1 var(--ui);color:#0B0B0D;flex:none}
.pinned{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:2px 0 6px}
.pin{height:36px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:background .16s}
.pin:hover{background:var(--hover)}.pin.on{background:var(--raise)}
.pin.slot{border:1px dashed var(--light-3);background:var(--hover-2)}
.sep{height:1px;background:var(--line);margin:4px 8px}
.list{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 18px),transparent);mask-image:linear-gradient(#000 calc(100% - 18px),transparent)}.list::-webkit-scrollbar{display:none}.spaces{background:var(--side)}
.stab{position:relative;height:32px;display:flex;align-items:center;gap:10px;padding:0 6px 0 8px;border-radius:8px;color:var(--mute);font-size:13px;text-align:left;width:100%;flex:none;transition:transform .2s var(--ease),background .16s}
.stab:hover{background:var(--hover);color:var(--ink)}.stab.on{background:var(--raise);color:var(--ink)}
.title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--dim);opacity:0}.stab:hover .x,.stab.on .x{opacity:1}
.newtab{color:var(--dim)}
.fav{width:16px;height:16px;border-radius:4px;flex:none;display:grid;place-items:center;font:700 8px/1 var(--ui);color:#fff;position:relative}
.pin .fav{width:18px;height:18px}
/* dormindo: favicon apagado + lua no canto */
.sleeping .fav{background:var(--raise-2)!important;color:var(--dim)}.sleeping .title{color:var(--dim)}
.moon{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;border-radius:50%;background:var(--side);display:grid;place-items:center;color:var(--mute)}
.moon svg{width:10px;height:10px;fill:currentColor;stroke:none}
.sleeping .moon,.asleep .moon{display:grid}.moon{display:none}
.stab.on .moon{background:var(--raise)}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--line-strong);border-top-color:var(--light-3);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.waking .fav{animation:wake .6s var(--ease)}@keyframes wake{from{opacity:.4}}
.spk{color:var(--mute);display:grid;place-items:center}
/* atos no pé */
.spaces{display:flex;align-items:center;justify-content:center;gap:2px;padding:8px 0 6px;border-top:1px solid var(--line);flex:none;position:relative}
.space{position:relative;width:30px;height:28px;border-radius:8px;display:grid;place-items:center;transition:background .16s,box-shadow .16s}
.space:hover{background:var(--hover)}.space.on{background:var(--raise)}
.space.on::after{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--light-3)}
.space .logo{width:16px;height:16px;font-size:9.5px;border-radius:4px;transition:transform .2s var(--spring),opacity .2s}
.space.on .logo{transform:scale(1.12)}
.space.asleep .logo{opacity:.4}
.space .moon{right:1px;bottom:1px}
.space.target{background:var(--hover-2);box-shadow:inset 0 0 0 1px var(--light-3)}
.col .spaces{flex-direction:column;border-top:0}
.col .space-title{justify-content:center;padding:6px 0}
.col .sb .title,.col .sb .nm,.col .pinned,.col .sep,.col .x,.col .meta{display:none}
.col .stab{justify-content:center;padding:0}
/* arrastar */
.stab.lift{background:var(--raise);color:var(--ink);box-shadow:var(--lift),inset 0 0 0 1px var(--line-strong);transform:translate(6px,var(--dy,0)) scale(1.03);z-index:5;cursor:grabbing}
.pin.lift{background:var(--raise);box-shadow:var(--lift);transform:translate(8px,58px) scale(1.04);z-index:5}
.gap{height:32px;flex:none;position:relative;animation:open .2s var(--ease)}
.gap::before{content:"";position:absolute;left:8px;right:8px;top:15px;height:2px;border-radius:1px;background:var(--light-3)}
@keyframes open{from{height:0}}
.stab.drop{animation:drop .2s var(--ease)}@keyframes drop{from{transform:translate(6px,-8px) scale(1.03);box-shadow:var(--lift)}}
.ghost{position:absolute;z-index:6;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;background:var(--raise);box-shadow:var(--lift),inset 0 0 0 1px var(--line-strong);font-size:12.5px;white-space:nowrap;pointer-events:none}
.collapse{animation:shut .2s var(--ease) forwards}@keyframes shut{to{height:0;opacity:0}}
/* abrir, fechar, trocar */
.stab.in{animation:tin .2s var(--ease)}@keyframes tin{from{height:0;opacity:0;transform:translateX(-8px)}}
.stab.out{animation:tout .18s var(--ease) forwards;overflow:hidden}@keyframes tout{to{height:0;opacity:0;transform:translateX(-8px)}}
.from-r{animation:fromR .2s var(--ease)}.from-l{animation:fromL .2s var(--ease)}
@keyframes fromR{from{opacity:0;transform:translateX(16px)}}@keyframes fromL{from{opacity:0;transform:translateX(-16px)}}
.fade{animation:fade .2s var(--ease)}@keyframes fade{from{opacity:0}}
/* cartão e menus */
.card{position:absolute;z-index:8;width:250px;padding:12px 14px;border-radius:12px;background:var(--float);border:1px solid var(--line-strong);animation:rise .16s var(--ease);font-size:12.5px}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.card .h-t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .h-u{color:var(--dim);font-size:12px;margin-bottom:10px}
.card .h-m{display:flex;justify-content:space-between;gap:8px;color:var(--mute);padding-top:10px;border-top:1px solid var(--line)}.card .h-m b{font:400 12px var(--mono);color:var(--ink)}
.card .h-s{color:var(--dim);font-size:12px;margin-top:4px}
.meter{height:4px;border-radius:2px;background:var(--line-strong);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--mute);border-radius:2px}
.menu{position:absolute;z-index:9;min-width:250px;padding:5px;border-radius:12px;background:var(--float);border:1px solid var(--line-strong);animation:rise .16s var(--ease)}
.menu .mh{padding:8px 10px 3px;font-size:11.5px;color:var(--dim)}
.mi{width:100%;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:7px;text-align:left;color:var(--mute);font-size:13px}
.mi:hover,.mi.hl{background:var(--raise);color:var(--ink)}.mi .k{margin-left:auto;font:11.5px var(--mono);color:var(--dim)}.mi.off{opacity:.45}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.tip{position:absolute;z-index:8;padding:5px 9px;border-radius:8px;background:var(--float);border:1px solid var(--line-strong);font-size:12px;white-space:nowrap;animation:rise .16s var(--ease)}
.tip small{color:var(--dim);margin-left:6px}
/* página */
.content{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:auto;position:relative}
.page{max-width:640px;margin:0 auto;padding:36px 24px}
.h-display{font-size:24px;font-weight:600;line-height:1.22;letter-spacing:-.018em;margin:0 0 12px}
.sk{background:var(--raise);border-radius:5px;height:11px;margin:11px 0}
.sk.pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}
.wakebox{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13px}
.wakebox .logo{width:40px;height:40px;font-size:18px;border-radius:11px;margin:0 auto 12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:10px;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--line-hover);background:var(--hover-2)}.btn.pri{background:var(--hi);border-color:var(--hi);color:var(--on-hi);font-weight:600}
.btn.sm{padding:4px 10px;font-size:12.5px}
/* páginas internas */
.ip{max-width:760px;margin:0 auto;padding:30px 26px 40px}
.ip-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}.ip-h h1{font-size:22px;font-weight:600;margin:0;flex:1}
.search{height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);color:var(--dim);width:240px;font-size:13px}
.chips{display:flex;gap:6px;margin:0 0 6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--mute)}.chip.on{background:var(--raise);color:var(--ink);border-color:var(--line-strong)}.chip .logo{width:14px;height:14px;font-size:8px;border-radius:4px}
.day{font-size:12.5px;font-weight:600;color:var(--mute);margin:20px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:8px;font-size:13.5px}.row:hover{background:var(--hover)}
.row .time{width:44px;color:var(--dim);font:12px var(--mono)}.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .d{color:var(--dim);font-size:12px;white-space:nowrap}
.dl{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.dl .fi{width:34px;height:40px;border-radius:6px;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;font:600 9px var(--mono);color:var(--mute);flex:none}
.dl .info{flex:1;min-width:0}.dl .info b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl .info small{color:var(--dim);font-size:12px}
.prog{height:4px;border-radius:2px;background:var(--line-strong);margin:6px 0 2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--light-3)}
.settings{display:grid;grid-template-columns:200px 1fr;min-height:100%}
.snav{padding:24px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.snav span{padding:6px 10px;border-radius:8px;font-size:13px;color:var(--mute)}.snav span.on{background:var(--raise);color:var(--ink)}
.spage{padding:24px 28px}.spage h2{font-size:18px;margin:0 0 4px}.crumb{color:var(--dim);font-size:12.5px;margin-bottom:16px}
.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:13px}.grp .opt:first-child{border-top:0}
.opt .lb{flex:1}.opt .lb small{display:block;color:var(--dim);font-size:12px}
.radio{width:16px;height:16px;border-radius:50%;border:1.6px solid var(--line-strong);flex:none}.radio.on{border:5px solid var(--hi)}
.ghd{font-size:12px;color:var(--dim);margin:18px 0 6px}
.err{height:100%;display:grid;place-items:center;text-align:center;color:var(--mute);padding:24px}
.err h2{color:var(--ink);font-size:22px;font-weight:600;margin:14px 0 6px}.err code{font:12px var(--mono);color:var(--dim)}
.about{height:100%;display:grid;place-items:center;text-align:center}
.about svg{width:64px;height:64px;margin:0 auto 14px}
.about h2{font-size:20px;margin:0}.about table{margin:16px auto 0;font-size:12.5px;border-collapse:collapse;text-align:left}.about td{padding:4px 10px;color:var(--dim)}.about td+td{color:var(--ink);font-family:var(--mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:8px}.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.compare>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--dim)}.compare b{color:var(--ink);font-weight:500;display:block;margin-bottom:2px}
@media (max-width:820px){.settings{grid-template-columns:1fr}.snav{display:none}.compare{grid-template-columns:1fr}.search{display:none}}
@media (max-width:640px){.win .sb{width:40px}.win .sb .title,.win .pinned,.win .sep,.win .x,.win .nm{display:none}.win .stab{justify-content:center;padding:0}.win .spaces{flex-direction:column;border-top:0}main{padding:20px 16px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-moon" viewBox="0 0 20 20"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></symbol>
</defs></svg>
<main>
<header><div><h1>Abas, sono e páginas internas · navegador sozinho</h1>
<p>Casca nativa (janela.html), abas na lateral, ato Estúdio. Clique nos estados de cada seção; os botões ▶ tocam a animação. Tokens do Grafite; movimento até 200 ms.</p></div>
<div class="ctl"><div class="seg" id="mode"><button data-m="dark" aria-pressed="true">Escuro</button><button data-m="light" aria-pressed="false">Claro</button></div>
<span class="tog">Reduzir movimento <button class="switch" id="rm" role="switch" aria-checked="false" aria-label="Reduzir movimento"></button></span></div></header>
<nav class="topnav" id="nav"></nav>
<section id="sec"></section>
</main>
<script>
const ICON={
 back:'<svg class="icon" viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg>',fwd:'<svg class="icon" viewBox="0 0 20 20"><path d="m8 4 6 6-6 6"/></svg>',
 re:'<svg class="icon" viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-2-4.5M16 3v3.5h-3.5"/></svg>',
 side:'<svg class="icon" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2.5"/><path d="M8 4v12"/></svg>',
 plus:'<svg class="icon" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>',x:'<svg class="icon" viewBox="0 0 20 20" style="width:13px;height:13px"><path d="m6 6 8 8M14 6l-8 8"/></svg>',

 "Estúdio":[["#5E6AD2","L","Linear · Sprint 42","linear.app",180],["#0F9D58","P","Planilha de preços","docs.google.com",142],["#635BFF","S","Stripe · painel","dashboard.stripe.com",96],["#FF0000","Y","YouTube · live do lançamento","youtube.com",410],["#24292F","GH","PR #812 · casca","github.com",120],["#83D0F2","M","MDN · Popover API","developer.mozilla.org",64]],

const fav=(t,cls="")=>`<span class="fav ${cls}" style="background:${t[0]}">${t[1]}<span class="moon">${ICON.moon}</span></span>`;
const logo=a=>`<span class="logo" style="background:${a[2]}">${a[1]}</span>`;

/* uma janela; o: {ato, col, tabs (lista com flags), pins, spaces, content, url, loading, extra, listExtra, cls} */
function win(o={}){
 const ato=ATOS.find(a=>a[0]==(o.ato||"Estúdio"));
 const tabs=o.tabs||TABS[ato[0]].map((t,i)=>({t,on:i==0}));
 const pins=o.pins||PINS.map(p=>({t:p}));
 const rows=tabs.map(r=>r.gap?`<div class="gap"></div>`:`<button class="stab${r.on?" on":""}${r.cls?" "+r.cls:""}" ${r.style?`style="${r.style}"`:""} ${r.id?`id="${r.id}"`:""}>${fav(r.t)}<span class="title">${r.t[2]}</span>${r.spk?`<span class="spk meta">${ICON.spk}</span>`:""}<span class="x">${ICON.x}</span>${r.extra||""}</button>`).join("");
 const sp=ATOS.map(a=>{const s=(o.spaces||{})[a[0]]||"";return `<button class="space${a[0]==ato[0]?" on":""} ${s}" data-ato="${a[0]}" aria-label="${a[0]}">${logo(a)}<span class="moon">${ICON.moon}</span></button>`}).join("")+`<button class="space" style="color:var(--dim)">${ICON.plus}</button>`;
 return `<div class="win ${o.col?"col":""} ${o.loading?"loading":""} ${o.cls||""}">
 <div class="bar"><div class="lights"><i></i><i></i><i></i></div><button class="tb" data-act="toggle" title="Mostrar ou esconder a lateral (⌘S)">${ICON.side}</button><span class="tb">${ICON.back}</span><span class="tb">${ICON.fwd}</span><span class="tb">${ICON.re}</span>
 <div class="omni">${o.url&&o.url.startsWith("agens:")?"":ICON.lock}<b>${o.url||tabs.find(r=>r.on)?.t[3]||""}</b></div></div>
 <div class="loadbar"></div>
 <div class="body"><aside class="sb">
  <div class="space-title ${o.swap||""}">${logo(ato)}<span class="nm">${ato[0]}</span></div>
  <div class="pinned ${o.swap||""}">${pins.map(p=>`<span class="pin${p.on?" on":""}${p.cls?" "+p.cls:""}">${p.t?fav(p.t):""}</span>`).join("")}</div>
  <div class="sep"></div>
  <div class="list ${o.swap||""}" id="${o.listId||""}">${rows}<button class="stab newtab" data-act="new"><span class="fav" style="color:var(--dim)">${ICON.plus}</span><span class="title">Nova aba</span></button></div>
  <div class="spaces">${sp}</div>${o.sbExtra||""}
 </aside><div class="content">${o.content||page(tabs.find(r=>r.on)?.t[2]||"")}</div></div>${o.extra||""}</div>`}
const page=t=>`<div class="page fade"><h3 class="h-display">${t}</h3><div class="sk" style="width:92%"></div><div class="sk" style="width:84%"></div><div class="sk" style="width:88%"></div><div class="sk" style="width:60%"></div><div class="sk" style="width:90%;margin-top:28px"></div><div class="sk" style="width:78%"></div></div>`;
const T=TABS["Estúdio"];
const base=(over={})=>T.map((t,i)=>Object.assign({t,on:i==0},over[i]||{}));

/* ===== Seções ===== */
const S={};
S.reordenar={nome:"1 · Reordenar arrastando",cap:"Segurar e arrastar uma aba para cima ou para baixo. A aba sobe (única sombra da casca, só enquanto está na mão), as outras abrem um vão onde ela vai cair, com o fio âmbar no meio. Soltar: assenta em 200 ms.",
 states:{
 "Parado":()=>win({tabs:base({1:{on:false}})}),
 "Levantou":()=>win({tabs:base({2:{cls:"lift"}})}),
 "Arrastando · vão abre":()=>{const t=base();const r=t.splice(2,1)[0];r.cls="lift";r.style="position:absolute;top:154px;left:0;width:236px;--dy:0px";t.splice(4,0,{gap:1});t.push(r);return win({tabs:t})},
 "Soltou":()=>{const t=base();const r=t.splice(2,1)[0];r.cls="drop";t.splice(4,0,r);return win({tabs:t})},
 "Para as fixadas":()=>{const t=base();t.splice(3,1);return win({tabs:t,pins:[...PINS.map(p=>({t:p})),{cls:"slot"}],extra:`<div class="ghost" style="left:196px;top:96px">${fav(T[3])}YouTube · live</div><div class="tip" style="left:22px;top:146px">Soltar para fixar <small>vira ladrilho</small></div>`})},
 "Tirar das fixadas":()=>{const t=base();t.splice(1,0,{gap:1});return win({tabs:t,pins:PINS.map((p,i)=>({t:p,cls:i==2?"lift":""}))})},
 "Para outro ato":()=>{const t=base();t.splice(4,1);t.splice(4,0,{gap:1,cls:"collapse"});return win({tabs:t,spaces:{"Cliente A":"target"},extra:`<div class="ghost" style="left:110px;top:468px">${fav(T[4])}PR #812</div><div class="tip" style="left:60px;top:430px">Mover para <b>Cliente A</b> <small>sai daqui, sem cookies</small></div>`})},
 "Recolhida (40 pt)":()=>{const t=base();const r=t.splice(1,1)[0];r.cls="lift";t.splice(3,0,{gap:1});t.splice(4,0,r);return win({col:true,tabs:t,extra:`<div class="tip" style="left:74px;top:250px">Planilha de preços</div>`})}},
 note:"Fixadas: a 5ª ganha uma linha nova de ladrilhos (o vão aparece no fim da grade). Recolhida: só ícones, o nome sai num balão ao lado. Soltar no ato move a aba sem levar a sessão (cada ato tem cookies próprios); a aba recarrega no ato novo. Teclado: ⌥⌘↑/↓ move a aba ativa."};

 "Configurações":()=>win({url:"agens://configuracoes/desempenho",tabs:base({0:{on:false},2:{cls:"sleeping"},4:{cls:"sleeping"}}),content:settingsPerf()})},
 note:"A memória vem do mesmo número do Monitor de Atividade (footprint do processo da aba). Aba que não pode dormir agora (áudio, upload, formulário editado, câmera, fixada) mostra o motivo no cartão no lugar de 'Dorme em 5 min'. 'Pôr para dormir agora' some (ou fica apagado com o motivo) nessas abas."};
function card(t,lbl,mb,st,pct,top){return `<div class="card" style="left:262px;top:${top}px"><div class="h-t">${t[2]}</div><div class="h-u">${t[3]}</div><div class="h-m"><span>${lbl}</span><b>${mb}</b></div>${pct?`<div class="meter"><i style="width:${pct*100}%"></i></div>`:""}<div class="h-s">${st}</div></div>`}
function settingsPerf(){const sw=(on)=>`<span class="switch" role="switch" aria-checked="${on}"></span>`;
 return `<div class="settings fade"><div class="snav"><span>Aparência</span><span>Atos</span><span>Privacidade</span><span class="on">Desempenho</span><span>Downloads</span><span>Sobre</span></div><div class="spage"><h2>Desempenho</h2><div class="crumb">Abas e atos que dormem liberam memória sem fechar nada.</div>
 <div class="grp"><div class="opt"><span class="lb">Pôr abas para dormir<small>Abas em segundo plano dormem depois de um tempo</small></span>${sw(true)}</div><div class="opt"><span class="lb">Dormir depois de</span><span class="btn sm">5 min ▾</span></div><div class="opt"><span class="lb">Mostrar a memória no cartão da aba</span>${sw(true)}</div></div>

 states:{
 "Acordado × dormindo":()=>win({spaces:{"Cliente A":"","Pessoal":"asleep"},extra:`<div class="tip" style="left:120px;top:462px">Pessoal <small>dormindo · 0 MB · 2 abas</small></div>`}),
 "Hover · acordado":()=>win({spaces:{"Pessoal":"asleep"},extra:`<div class="tip" style="left:96px;top:462px">Cliente A <small>acordado · 512 MB · 3 abas</small></div>`}),
 "Trocou · acordando":()=>win({ato:"Pessoal",loading:1,swap:"from-r",tabs:TABS["Pessoal"].map((t,i)=>({t,on:i==0,cls:i==0?"waking":"sleeping"})),spaces:{"Estúdio":""},content:`<div class="wakebox fade"><div>${logo(ATOS[2])}Acordando Pessoal<div style="color:var(--dim);font-size:12px">abrindo só a aba da frente</div></div></div>`}),
 "Acordado":()=>win({ato:"Pessoal",tabs:TABS["Pessoal"].map((t,i)=>({t,on:i==0,cls:i==0?"":"sleeping"}))}),
 "Botão direito no ato":()=>win({spaces:{"Pessoal":"asleep"},extra:`<div class="menu" style="left:70px;top:252px"><div class="mh">Cliente A · 3 abas · 512 MB</div><button class="mi">Abrir</button><button class="mi">Configurar ato…</button><hr><button class="mi hl">Pôr o ato para dormir<span class="k">libera 512 MB</span></button><button class="mi">Nunca pôr para dormir</button><hr><button class="mi">Apagar ato…</button></div>`}),
 "Indo dormir":()=>win({spaces:{"Cliente A":"asleep","Pessoal":"asleep"},extra:`<div class="tip" style="left:96px;top:462px">Cliente A foi dormir <small>liberou 512 MB</small></div>`})},
 note:"O ato em uso nunca dorme. Ato com aba tocando áudio, upload ou agente controlando não dorme e o item fica apagado com o motivo. Recolhida: mesma lua sobre o monograma na coluna."};
S.anim={nome:"4 · Animações da lateral",cap:"Toque cada animação. Tudo em 200 ms com a curva do Agens (ease de saída). Com Reduzir movimento ligado (aqui ou no sistema), tudo muda na hora, sem deslizar nem esmaecer.",
 states:{"Janela":()=>win({listId:"alist"})},
 play:[["⌘S · recolher/abrir","toggle"],["Abrir aba","open"],["Fechar aba","close"],["Trocar ato →","swapR"],["← Trocar ato","swapL"]],
 note:"⌘S também funciona nesta página. A lateral anima a largura (236 ⇄ 40 pt) e os nomes somem na metade; a página acompanha. Abrir: a linha cresce de 0 a 32 pt e entra da esquerda; fechar: o contrário e as de baixo sobem. Trocar ato: título, fixadas e lista deslizam 16 pt na direção do ato novo."};
S.paginas={nome:"5 · Páginas internas",cap:"As páginas que ainda tinham cara de Chromium, na folha do Agens: mesma lateral de seções, grupos com fio de 1 px, chave e botões do Agens. Endereço agens:// (chrome:// continua funcionando e redireciona).",
 states:{
 "Configurações › site":()=>win({url:"agens://configuracoes/privacidade/sites",tabs:base({0:{on:false}}),content:settingsSite()}),
 "Histórico":()=>win({url:"agens://historico",tabs:base({0:{on:false}}),content:hist()}),
 "Downloads":()=>win({url:"agens://downloads",tabs:base({0:{on:false}}),content:downloads()}),
 "Sem conexão":()=>win({url:"linear.app",content:`<div class="err fade"><div>${ICON.wifi}<h2>Sem conexão com a internet</h2><div>Confira o Wi-Fi ou o cabo. A página abre sozinha quando a rede voltar.</div><div><code>ERR_INTERNET_DISCONNECTED</code></div><button class="btn pri" style="margin-top:18px">Tentar de novo</button></div></div>`}),
 "Site não encontrado":()=>win({url:"lineaer.app",content:`<div class="err fade"><div>${ICON.globe}<h2>Não achamos lineaer.app</h2><div>O endereço pode estar digitado errado. Você quis dizer <b style="color:var(--ink)">linear.app</b>?</div><div><code>DNS_PROBE_FINISHED_NXDOMAIN</code></div><div style="display:flex;gap:8px;justify-content:center;margin-top:18px"><button class="btn pri">Ir para linear.app</button><button class="btn">Buscar “lineaer”</button></div></div></div>`}),
 "Sobre":()=>win({url:"agens://sobre",tabs:base({0:{on:false}}),content:`<div class="about fade"><div>${MARK}<h2>Navegador Agens</h2><div style="color:var(--dim);font-size:13px">SugiyamaLabs</div><div class="pill">Atualizado</div><table><tr><td>Versão</td><td>0.9.0 (2026.11.16)</td></tr><tr><td>Chromium</td><td>143.0.7499.40</td></tr><tr><td>Sistema</td><td>macOS 27.0 · arm64</td></tr><tr><td>Perfil</td><td>~/Library/Application Support/Agens</td></tr></table><div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><button class="btn sm">Copiar dados da versão</button><button class="btn sm">Licenças</button></div></div></div>`})},
 note:"Ficam do Chromium, sem marca: o DevTools e chrome://flags e chrome://inspect (páginas de dev). 'Sobre' substitui chrome://version e a seção Sobre das Configurações."};
function settingsSite(){return `<div class="settings fade"><div class="snav"><span>Aparência</span><span>Atos</span><span class="on">Privacidade</span><span>Desempenho</span><span>Downloads</span><span>Sobre</span></div><div class="spage"><h2>Permissões dos sites</h2><div class="crumb">Privacidade › Sites · vale para o ato Estúdio</div>
 <div class="grp"><div class="opt"><span class="lb">Câmera<small>Perguntar antes</small></span><span>›</span></div><div class="opt"><span class="lb">Microfone<small>Perguntar antes</small></span><span>›</span></div><div class="opt"><span class="lb">Localização<small>Não deixar</small></span><span>›</span></div><div class="opt"><span class="lb">Notificações<small>Não deixar · 2 exceções</small></span><span>›</span></div></div>
 <div class="ghd">Cookies de terceiros</div><div class="grp"><div class="opt"><span class="radio on"></span><span class="lb">Bloquear sempre</span></div><div class="opt"><span class="radio"></span><span class="lb">Bloquear na janela privativa</span></div><div class="opt"><span class="radio"></span><span class="lb">Deixar</span></div></div></div></div>`}
function hist(){const r=(h,t,d,i)=>`<div class="row"><span class="time">${h}</span>${fav(t)}<span class="t">${t[2]}</span><span class="d">${d}</span>${i?`<span class="logo" style="width:14px;height:14px;font-size:8px;border-radius:4px;background:${ATOS[i][2]}">${ATOS[i][1]}</span>`:""}</div>`;
 return `<div class="ip fade"><div class="ip-h"><h1>Histórico</h1><label class="search">${ICON.search}Buscar no histórico</label></div><div class="chips"><span class="chip on">Todos os atos</span>${ATOS.map(a=>`<span class="chip">${logo(a)}${a[0]}</span>`).join("")}</div>
 <div class="day">Hoje · segunda, 16 de novembro</div>${r("14:22",T[0],"linear.app",0)}${r("14:05",T[2],"dashboard.stripe.com",0)}${r("13:48",TABS["Cliente A"][1],"figma.com",1)}${r("11:30",T[4],"github.com",0)}
 <div class="day">Ontem</div>${r("22:10",TABS["Pessoal"][1],"netflix.com",2)}${r("18:02",T[5],"developer.mozilla.org",0)}<p class="note" style="margin-top:18px">Limpar histórico… · fica só neste Mac, nada sai daqui.</p></div>`}
function downloads(){const d=(ext,n,s,p,btn)=>`<div class="dl"><span class="fi">${ext}</span><div class="info"><b>${n}</b>${p!=null?`<div class="prog"><i style="width:${p}%"></i></div>`:""}<small>${s}</small></div>${btn}</div>`;
 return `<div class="ip fade"><div class="ip-h"><h1>Downloads</h1><label class="search">${ICON.search}Buscar downloads</label></div>
 ${d("DMG","Figma-127.3.dmg","84 de 212 MB · 12 s restantes · Cliente A",40,'<button class="btn sm">Pausar</button>')}
 <div class="day">Hoje</div>${d("PDF","proposta-precos-2027.pdf","1,2 MB · docs.google.com · Estúdio",null,'<button class="btn sm">Mostrar no Finder</button>')}${d("ZIP","assets-landing.zip","38 MB · figma.com · Cliente A",null,'<button class="btn sm">Mostrar no Finder</button>')}
 ${d("CSV","export-clientes.csv","Falhou · rede caiu",null,'<button class="btn sm">Tentar de novo</button>')}<p class="note">Pasta: ~/Downloads · cada ato pode ter a sua (Atos › Downloads).</p></div>`}

/* ===== Navegação e estado ===== */
const keys=Object.keys(S);let cur=location.hash.slice(1);if(!S[cur])cur=keys[0];const st={};
const nav=document.getElementById("nav"),sec=document.getElementById("sec");
function render(){atoI=0;const s=S[cur];const sn=Object.keys(s.states);const k=st[cur]||sn[0];
 nav.innerHTML=keys.map(x=>`<button data-sec="${x}" aria-current="${x==cur}">${S[x].nome}</button>`).join("");
 sec.innerHTML=`<p class="cap">${s.cap}</p><div class="states">${sn.length>1?sn.map(n=>`<button data-st="${n}" aria-pressed="${n==k}">${n}</button>`).join(""):""}${(s.play||[]).map(p=>`<button class="play" data-play="${p[1]}">▶ ${p[0]}</button>`).join("")}</div><div id="stage">${s.states[k]()}</div><p class="note">${s.note}</p>`}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.sec){cur=b.dataset.sec;history.replaceState(null,"","#"+cur);render();scrollTo(0,0)}
 else if(b.dataset.st){st[cur]=b.dataset.st;render()}
 else if(b.dataset.play)play(b.dataset.play);
 else if(b.dataset.act=="toggle")play("toggle");
 else if(b.dataset.act=="new"&&cur=="anim")play("open");
 else if(b.dataset.ato&&cur=="anim"){const w=document.querySelector("#stage .win");const i=ATOS.findIndex(a=>a[0]==b.dataset.ato);swap(i)}
 else if(b.dataset.m){document.documentElement.dataset.mode=b.dataset.m;document.querySelectorAll("#mode button").forEach(x=>x.setAttribute("aria-pressed",x==b))}
 else if(b.id=="rm"){const on=b.getAttribute("aria-checked")!="true";b.setAttribute("aria-checked",on);document.documentElement.classList.toggle("rm",on)}});
addEventListener("keydown",e=>{if(e.metaKey&&e.key.toLowerCase()=="s"){e.preventDefault();play("toggle")}});
let atoI=0;
function swap(i){if(i==atoI)return;const dir=i>atoI?"from-r":"from-l";atoI=i;document.getElementById("stage").innerHTML=win({ato:ATOS[i][0],swap:dir,listId:"alist"})}
function play(a){const w=document.querySelector("#stage .win");if(!w)return;
 if(a=="toggle")return w.classList.toggle("col");
 if(cur!="anim"){cur="anim";render();return play(a)}
 const l=document.getElementById("alist");
 if(a=="open"){const t=[["#FF6B35","N"],["#00A67E","O"],["#5865F2","D"]][l.children.length%3];l.querySelectorAll(".stab.on").forEach(x=>x.classList.remove("on"));
  l.querySelector(".newtab").insertAdjacentHTML("beforebegin",`<button class="stab on in">${fav([t[0],t[1]])}<span class="title">Nova aba</span><span class="x">${ICON.x}</span></button>`)}
 if(a=="close"){const tabs=[...l.querySelectorAll(".stab:not(.newtab):not(.out)")];const t=tabs[tabs.length-1];if(!t)return;
  if(document.documentElement.classList.contains("rm"))t.remove();else{t.classList.add("out");t.addEventListener("animationend",()=>t.remove(),{once:true})}}
 if(a=="swapR")swap(Math.min(atoI+1,2));if(a=="swapL")swap(Math.max(atoI-1,0))}
if(matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("rm");document.getElementById("rm").setAttribute("aria-checked","true")}
render();
</script>
