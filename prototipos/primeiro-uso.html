<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agens · primeira instalação</title>
<style>
/* Tokens: Grafite e Brasa do Agens (Agens-Prototipos/DESIGN.md), os mesmos de janela.html */
:root {
  --bg:#0B0B0D; --side:#111114; --raise:#16161A; --sunk:#0F0F12; --line:#24242A; --line-strong:#3A3A42;
  --ink:#F2F2F4; --mute:#9A9AA4; --dim:#8A8A94; --hi:#F4F4F6; --warn:#F2C14E;
  --hover:#18181C; --hover-2:#1B1B20; --float:#1A1A1F; --raise-2:#26262D; --line-hover:#4A4A54; --on-hi:#0B0B0D;
  --light-1:#FFFDF7; --light-2:#FFE9C7; --light-3:#FFC98A; --light-4:#F7A95C;
  --surface: radial-gradient(1200px 520px at 50% -120px, rgba(255,255,255,.055), transparent 70%);
  --ui: -apple-system, "SF Pro Text", BlinkMacSystemFont, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(.16,1,.3,1); --spring: cubic-bezier(.34,1.56,.64,1);
  --round: 1; --pill: 0;
}
:root[data-theme="vidro"] { --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.18); --line-hover: rgba(255,255,255,.26); --hover: rgba(255,255,255,.06); --hover-2: rgba(255,255,255,.08); --raise: rgba(255,255,255,.1); --raise-2: rgba(255,255,255,.14); --sunk: rgba(0,0,0,.22); --round: 1.3; --pill: 1; }
[data-theme="vidro"] body { background: radial-gradient(900px 600px at 15% 10%, #3a5a8c, transparent 60%), radial-gradient(800px 700px at 85% 30%, #8c4a6e, transparent 60%), radial-gradient(900px 600px at 50% 100%, #c08a4a, transparent 60%), #1a1b24; }
[data-theme="vidro"] .ob, [data-theme="vidro"] .panel { background: rgba(28,28,34,.42); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border-color: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 30px 80px rgba(0,0,0,.35); }
[data-theme="vidro"] .form, [data-theme="vidro"] .field { background: rgba(255,255,255,.06); }
@media (prefers-reduced-transparency: reduce) { [data-theme="vidro"] .ob, [data-theme="vidro"] .panel { background: #111114; backdrop-filter: none; } }
:root[data-theme="brasa"] {
  --bg:#110D0A; --side:#16110D; --raise:#1E1712; --sunk:#130E0B; --hover:#211913; --hover-2:#241B15; --float:#241B15;
  --line:#2C221B; --line-strong:#47372A; --line-hover:#5A4636; --raise-2:#2A2018;
  --ink:#F8F0E7; --mute:#B6A899; --dim:#A09182; --hi:#FFF3E4; --on-hi:#160F0A;
  --surface: radial-gradient(1100px 560px at 50% -140px, rgba(255,201,138,.11), transparent 70%), radial-gradient(700px 500px at 0% 110%, rgba(247,169,92,.06), transparent 70%);
  --round: 1.45; --pill: 1;
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
* { box-sizing: border-box; scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface), var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; caret-color: var(--light-3); display: grid; place-items: center; transition: background .45s var(--ease); }
::selection { background: rgba(255,201,138,.28); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--light-2); outline-offset: 2px; border-radius: calc(8px * var(--round)); }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* a janela do onboarding: uma folha centrada, camadas e fios */
.ob { width: min(760px, calc(100vw - 32px)); min-height: 560px; border: 1px solid var(--line); border-radius: calc(16px * var(--round)); background: var(--side); display: flex; flex-direction: column; overflow: hidden; position: relative; }
.ob-top { height: 52px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--line); }
.lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: #2A2A30; display: block; }
.steps { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.steps i { width: 7px; height: 7px; border-radius: 50%; border: 1.4px solid var(--line-strong); transition: background .3s var(--ease), border-color .3s var(--ease), transform .4s var(--spring); }
.steps i.done { background: var(--mute); border-color: var(--mute); }
.steps i.on { background: var(--light-3); border-color: var(--light-3); transform: scale(1.25); }
.ob-body { flex: 1; padding: 44px 56px 24px; display: flex; flex-direction: column; }
.ob-body.in-r { animation: inR .36s var(--ease); } .ob-body.in-l { animation: inL .36s var(--ease); }
@keyframes inR { from { opacity: 0; transform: translateX(28px); } } @keyframes inL { from { opacity: 0; transform: translateX(-28px); } }
.ob-foot { display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line); }
.ob-foot .hint { color: var(--dim); font-size: 12px; margin-right: auto; }
kbd { font-family: var(--mono); font-size: 11.5px; padding: 0 5px; border: 1px solid var(--line); border-radius: calc(5px * var(--round)); color: var(--mute); }

h1 { font-size: 28px; font-weight: 600; line-height: 1.22; letter-spacing: -.018em; margin: 0 0 8px; max-width: 26ch; }
.lead { color: var(--mute); font-size: 15px; margin: 0 0 28px; max-width: 58ch; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 1px solid var(--line-strong); border-radius: max(calc(10px * var(--round)), calc(var(--pill) * 999px)); font-size: 14px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--line-hover); background: var(--hover-2); }
.btn.pri { background: var(--hi); border-color: var(--hi); color: var(--on-hi); font-weight: 600; }
.btn.pri:hover { background: #fff; }
.btn.ghost { border-color: transparent; color: var(--mute); }
.btn.ghost:hover { color: var(--ink); background: var(--hover); }

/* a marca do Agens, com o estado "abrindo" e "feito" */
.mark { display: block; }
.mark .blk { transform-origin: 98px 98px; }
.mark .lt { transform-origin: 52px 52px; }
.opening .mark .lt { animation: lightIn .9s var(--spring) both; }
.opening .mark .blk { animation: blkIn .7s var(--ease) .26s both; }
@keyframes lightIn { from { transform: scale(0); } }
@keyframes blkIn { from { opacity: 0; transform: scale(.9); } }
.breath .mark .lt { animation: breath 4.6s ease-in-out infinite; }
@keyframes breath { 50% { transform: scale(.9); } }
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.hero h1 { margin: 22px auto 8px; } .hero .lead { margin: 0 auto 0; }
.wordmark { font: 700 18px/1 Unbounded, var(--ui); letter-spacing: -.02em; color: var(--ink); margin-top: 18px; }
.facts { display: flex; gap: 22px; justify-content: center; margin-top: 26px; color: var(--mute); font-size: 13px; }
.facts span { display: flex; align-items: center; gap: 7px; }
.facts .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--light-3); }

/* listas de escolha */
.choices { display: grid; gap: 8px; }
.choice { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: calc(12px * var(--round)); text-align: left; transition: border-color .16s var(--ease), background .16s var(--ease); }
.choice:hover { border-color: var(--line-strong); }
.choice[aria-pressed="true"], .choice[aria-checked="true"] { background: var(--raise); border-color: var(--line-strong); }
.choice .t { flex: 1; } .choice .t b { display: block; font-weight: 500; } .choice .t small { color: var(--dim); font-size: 12.5px; }
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.4px solid var(--line-strong); display: grid; place-items: center; flex: none; }
[aria-pressed="true"] .check, [aria-checked="true"] .check { background: var(--light-3); border-color: var(--light-3); }
[aria-pressed="true"] .check::after, [aria-checked="true"] .check::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--on-hi); }
.app-ic { width: 32px; height: 32px; border-radius: calc(8px * var(--round)); display: grid; place-items: center; font: 700 13px/1 var(--ui); color: #fff; flex: none; }
.what { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: max(calc(7px * var(--round)), calc(var(--pill) * 999px)); font-size: 12.5px; color: var(--mute); }
.chip[aria-pressed="true"] { border-color: var(--line-strong); color: var(--ink); background: var(--raise); }
.chip[aria-pressed="true"]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--light-3); }
.note { color: var(--dim); font-size: 12.5px; margin-top: 18px; }

/* atos */
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.team-list { display: grid; gap: 6px; align-content: start; }
.team-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: calc(10px * var(--round)); }
.team-row .t { flex: 1; } .team-row small { display: block; color: var(--dim); font-size: 12px; }
.team-row .x { width: 24px; height: 24px; border-radius: calc(7px * var(--round)); display: grid; place-items: center; color: var(--dim); }
.team-row .x:hover { background: var(--raise-2); color: var(--ink); }
.logo { width: 28px; height: 28px; border-radius: calc(7px * var(--round)); display: grid; place-items: center; font: 700 13px/1 var(--ui); color: #0B0B0D; flex: none; transition: background .25s var(--ease), transform .4s var(--spring); }
.logo.big { width: 56px; height: 56px; font-size: 24px; border-radius: calc(14px * var(--round)); }
.logo.pop { animation: pop .5s var(--spring); } @keyframes pop { from { transform: scale(.7); } }
.form { display: grid; gap: 14px; padding: 18px; border: 1px solid var(--line); border-radius: calc(12px * var(--round)); background: var(--raise); }
.form .row { display: flex; align-items: center; gap: 14px; }
label.f { display: grid; gap: 6px; font-size: 12.5px; color: var(--mute); }
.field { height: 38px; padding: 0 12px; border-radius: calc(10px * var(--round)); background: var(--sunk); border: 1px solid var(--line); color: var(--ink); outline: 0; width: 100%; }
.field:focus { border-color: var(--line-strong); }
.palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.sw { aspect-ratio: 1; border-radius: calc(6px * var(--round)); }
.sw[aria-pressed="true"] { outline: 2px solid var(--light-2); outline-offset: 2px; }
.sep { color: var(--dim); font-size: 12.5px; line-height: 1.6; }
.share { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: calc(12px * var(--round)); text-align: left; width: 100%; }
.share .t { flex: 1; } .share .t b { display: block; font-weight: 500; } .share .t small { color: var(--dim); font-size: 12.5px; }
.switch { width: 36px; height: 22px; border-radius: 11px; background: var(--raise-2); border: 1px solid var(--line-strong); position: relative; flex: none; transition: background .2s var(--ease); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--mute); transition: transform .32s var(--spring), background .2s var(--ease); }
.share[aria-checked="true"] .switch { background: var(--hi); border-color: var(--hi); }
.share[aria-checked="true"] .switch::after { transform: translateX(14px); background: var(--on-hi); }

/* visual */
.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.look { padding: 10px; border: 1px solid var(--line); border-radius: calc(12px * var(--round)); text-align: left; }
.look[aria-pressed="true"] { border-color: var(--light-3); background: var(--raise); }
.look b { display: block; font-weight: 500; margin-top: 8px; } .look small { color: var(--dim); font-size: 12px; }
.mini { height: 120px; border: 1px solid var(--line); border-radius: calc(8px * var(--round)); background: var(--bg); display: grid; padding: 6px; gap: 5px; }
.mini.top { grid-template-rows: 10px 12px 1fr; } .mini.side { grid-template-columns: 54px 1fr; grid-template-rows: 12px 1fr; }
.mini i { display: block; border-radius: 3px; background: var(--raise-2); }
.mini.top .tabs { display: flex; gap: 4px; background: none; } .mini.top .tabs i { width: 34px; }
.mini.side .sb { grid-row: 1 / 3; display: grid; gap: 4px; align-content: start; background: none; } .mini.side .sb i { height: 7px; }
.mini .pg { background: var(--side); border: 1px solid var(--line); }
.label { color: var(--dim); font-size: 12px; margin: 22px 0 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: max(calc(9px * var(--round)), calc(var(--pill) * 999px)); padding: 2px; gap: 2px; }
.seg button { padding: 4px 12px; border-radius: max(calc(7px * var(--round)), calc(var(--pill) * 999px)); color: var(--mute); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }

/* privacidade */
.priv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; }
.priv div { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.priv .ok { width: 16px; height: 16px; border-radius: 50%; background: var(--light-3); display: grid; place-items: center; flex: none; margin-top: 2px; }
.priv .ok svg { width: 10px; height: 10px; stroke: var(--on-hi); stroke-width: 2.2; }
.priv small { display: block; color: var(--dim); font-size: 12px; }
.zero { display: flex; align-items: center; gap: 14px; margin-top: 22px; padding: 14px 16px; border: 1px solid var(--line); border-radius: calc(12px * var(--round)); }
.zero b { font: 400 28px/1 var(--mono); }
.zero span { color: var(--mute); font-size: 13px; }

/* painel do protótipo */
.panel { position: fixed; right: 16px; top: 16px; width: 220px; padding: 12px; border: 1px solid var(--line); border-radius: calc(12px * var(--round)); background: var(--side); font-size: 12.5px; color: var(--mute); }
.panel b { color: var(--ink); display: block; margin-bottom: 4px; }
.panel .seg { margin-top: 8px; }
@media (max-width: 1180px) { .panel { position: static; margin: 16px auto; } body { display: block; padding: 16px; } .ob { margin: 0 auto; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Ícones da família do Agens: grade de 20, traço 1,6, pontas redondas. -->
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M5.5 5.5L14.5 14.5 M14.5 5.5L5.5 14.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5V15.5 M4.5 10H15.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5L8.2 14.2L15.5 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 20 20"><path d="M12.5 4.5L7 10L12.5 15.5"/></symbol>
</svg>
<template id="markTpl">
  <svg class="mark" viewBox="21 21 128 128" width="SIZE" height="SIZE" aria-hidden="true">
    <defs><radialGradient id="ml" cx=".42" cy=".38" r=".62"><stop offset="0" stop-color="#FFFDF7"/><stop offset=".45" stop-color="#FFE9C7"/><stop offset=".85" stop-color="#FFC98A"/><stop offset="1" stop-color="#F7A95C"/></radialGradient>
    <mask id="mc"><rect width="200" height="200" fill="#fff"/><circle cx="52" cy="52" r="34" fill="#000"/></mask></defs>
    <rect class="blk" x="52" y="52" width="92" height="92" rx="24" fill="#F2F0EC" mask="url(#mc)"/>
    <circle class="lt" cx="52" cy="52" r="26" fill="url(#ml)"/>
  </svg>
</template>

<div class="ob" role="dialog" aria-labelledby="obTitle">
  <div class="ob-top"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><div class="steps" id="steps" aria-hidden="true"></div></div>
  <div class="ob-body" id="body"></div>
  <div class="ob-foot"><span class="hint"><kbd>↵</kbd> continuar · <kbd>esc</kbd> voltar</span><button class="btn ghost" id="back">Voltar</button><button class="btn pri" id="next">Começar</button></div>
</div>

<aside class="panel"><b>Protótipo da primeira instalação</b>Da abertura do app até a primeira janela. Os atos criados aqui aparecem no pé da lateral.
  <div class="seg" id="theme"><button aria-pressed="true" data-v="grafite">Grafite</button><button aria-pressed="false" data-v="brasa">Brasa</button><button aria-pressed="false" data-v="vidro">Vidro</button></div>
  <div style="margin-top:8px"><button class="btn ghost" id="restart" style="padding:4px 8px;font-size:12.5px">Recomeçar</button></div>
</aside>

<script>
const PALETTE = { coral: "#FF7E98", tangerina: "#FF9D5C", terracota: "#E3876F", rosa: "#F46DB8", orquidea: "#CF6FEA", ameixa: "#A97AB8", lilas: "#9F86FF", indigo: "#6E86FF", azul: "#3F9CFF", ceu: "#3CC0F0", turquesa: "#2BC7C0", ardosia: "#7F9BC7" };
const st = {
  step: 0, from: "Brave", what: { Favoritos: true, Senhas: true, Histórico: true, "Abas abertas": false },
  teams: [{ name: "Pessoal", color: PALETTE.tangerina }],
  draft: { name: "", color: PALETTE.azul }, layout: "side", theme: "grafite", def: null, share: false,
};
const $ = s => document.querySelector(s), esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mark = n => $("#markTpl").innerHTML.replaceAll("SIZE", n);
const letter = name => (name.trim().split(/\s+/).pop()[0] || "?").toUpperCase();  // "Cliente A" → A, "Pessoal" → P
const okIc = '<span class="ok"><svg viewBox="0 0 20 20" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5L8.2 14.2L15.5 6"/></svg></span>';

const STEPS = [
  { next: "Começar", body: () => `<div class="hero opening">${mark(96)}<div class="wordmark">agens</div>
      <h1 id="obTitle">O navegador leve, bonito e que não conta nada a ninguém.</h1>
      <p class="lead">Abas que dormem, atos separados e privacidade no máximo desde agora.</p>
      <div class="facts"><span><i class="dot"></i>~300 MB com 20 abas</span><span><i class="dot"></i>zero telemetria</span><span><i class="dot"></i>bloqueador nativo</span></div></div>` },
  { next: "Importar", alt: "Começar do zero", body: () => `<h1 id="obTitle">Trazer o que você já tem?</h1>
      <p class="lead">Achamos estes navegadores no seu Mac. A importação acontece aqui, sem passar por servidor nenhum.</p>
      <div class="choices" role="radiogroup">${[["Brave", "#FB542B", "B", "Perfil “Default” · 412 favoritos · 38 senhas"], ["Safari", "#1E90FF", "S", "218 favoritos · senhas do Keychain"], ["Chrome", "#4A4A54", "C", "2 perfis"]].map(([n, c, l, d]) =>
        `<button class="choice" role="radio" aria-checked="${st.from === n}" data-from="${n}"><span class="app-ic" style="background:${c}">${l}</span><span class="t"><b>${n}</b><small>${d}</small></span><span class="check"></span></button>`).join("")}</div>
      <div class="what">${Object.entries(st.what).map(([k, v]) => `<button class="chip" aria-pressed="${v}" data-what="${k}">${k}</button>`).join("")}</div>
      <p class="note">Senhas vão para o Keychain do Mac. Dá para importar de novo depois, em Configurações › Perfis.</p>` },
  { next: "Continuar", body: () => {
      const d = st.draft, l = d.name ? letter(d.name) : "?";
      return `<h1 id="obTitle">Seus atos</h1>
      <p class="lead">Cada ato tem abas, logins, cookies e extensões só dele: um para cada frente da sua vida. Atos fora de uso dormem e não gastam memória.</p>
      <div class="teams">
        <div class="team-list">${st.teams.map((t, i) => `<div class="team-row"><span class="logo" style="background:${t.color}">${letter(t.name)}</span><span class="t">${esc(t.name)}<small>${i === 0 ? "O seu, com o que veio do " + st.from : "Novo, vazio"}</small></span>${i ? `<button class="x" aria-label="Tirar ${esc(t.name)}" data-rm="${i}"><svg class="icon"><use href="#i-x"/></svg></button>` : ""}</div>`).join("")}
          <p class="sep">Exemplos: Cliente A, Cliente B, Estúdio, Projeto X. Dá para criar e mudar depois, no <b>+</b> da lateral.</p>
          <button class="share" role="switch" aria-checked="${st.share}" data-share><span class="t"><b>Compartilhar cookies entre os atos?</b><small>${st.share ? "Ligado: entrar num site em um ato vale para todos." : "Desligado: cada ato tem os próprios logins. Recomendado."}</small></span><span class="switch"></span></button></div>
        <div class="form">
          <div class="row"><span class="logo big ${d.pop ? "pop" : ""}" style="background:${d.color}" id="prev">${l}</span>
            <label class="f" style="flex:1">Nome do ato<input class="field" id="tname" placeholder="Cliente A" value="${esc(d.name)}" autocomplete="off"></label></div>
          <div><div style="font-size:12.5px;color:var(--mute);margin-bottom:6px">Cor (aparece só no rosto do ato)</div>
            <div class="palette">${Object.entries(PALETTE).map(([k, c]) => `<button class="sw" style="background:${c}" aria-label="${k}" aria-pressed="${d.color === c}" data-color="${c}"></button>`).join("")}</div></div>
          <button class="btn" id="addTeam" ${d.name.trim() ? "" : "disabled style=\"opacity:.45;cursor:default\""}><svg class="icon"><use href="#i-plus"/></svg>Criar ato</button>
        </div>
      </div>`; } },
  { next: "Continuar", body: () => `<h1 id="obTitle">Do seu jeito</h1>
      <p class="lead">Muda a qualquer hora, sem reiniciar: <kbd>⌘⇧S</kbd> troca as abas de lugar.</p>
      <div class="looks">
        <button class="look" aria-pressed="${st.layout === "side"}" data-layout="side"><div class="mini side"><span class="sb"><i></i><i></i><i></i><i></i><i style="margin-top:auto"></i></span><i></i><i class="pg"></i></div><b>Abas na lateral</b><small>Com os atos no pé.</small></button>
        <button class="look" aria-pressed="${st.layout === "top"}" data-layout="top"><div class="mini top"><span class="tabs"><i></i><i></i><i></i></span><i></i><i class="pg"></i></div><b>Abas em cima</b><small>O jeito clássico.</small></button>
      </div>
      <div class="label">Tema</div>
      <div class="seg" id="themeIn"><button data-v="grafite" aria-pressed="${st.theme === "grafite"}">Grafite</button><button data-v="brasa" aria-pressed="${st.theme === "brasa"}">Brasa</button><button data-v="vidro" aria-pressed="${st.theme === "vidro"}">Vidro</button></div>` },
  { next: "Perfeito", body: () => `<h1 id="obTitle">Sua privacidade já está no máximo</h1>
      <p class="lead">Não precisa ligar nada. Se um site quebrar, você libera só ele.</p>
      <div class="priv">${[["Bloqueador de anúncios e rastreadores", "Nível forte, sem extensão"], ["Cookies de terceiros bloqueados", ""], ["Proteção contra impressão digital", "Os sites não te reconhecem pelo seu Mac"], ["DNS criptografado", "A operadora não vê os sites que você abre"], ["Sempre HTTPS", ""], ["Links sem rastreadores", "utm, fbclid e parecidos saem do link"], ["Busca no DuckDuckGo", "Troque em Configurações › Busca"], ["Senhas no Keychain do Mac", ""]].map(([t, d]) => `<div>${okIc}<span>${t}${d ? `<small>${d}</small>` : ""}</span></div>`).join("")}</div>
      <div class="zero"><b>0</b><span>conexões com o Agens parado. Sem telemetria, sem sync, sem conta. Medido a cada versão.</span></div>` },
  { next: "Tornar padrão", alt: "Agora não", body: () => `<h1 id="obTitle">Abrir os links no Agens?</h1>
      <p class="lead">Links do Slack, do e-mail e de outros apps abrem aqui, no ato certo: links de <span class="mono">cliente-a.test</span> abrem no Cliente A.</p>
      <div class="choices">${st.teams.map(t => `<div class="choice" style="cursor:default"><span class="logo" style="background:${t.color}">${letter(t.name)}</span><span class="t"><b>${esc(t.name)}</b><small>${t.name === "Pessoal" ? "Tudo o que não for de outro ato" : "Sites que você indicar"}</small></span></div>`).join("")}</div>
      <p class="note">O macOS pergunta uma vez. Dá para mudar em Configurações › Ao abrir.</p>` },
  { next: "Abrir o Agens", body: () => `<div class="hero"><div class="breath">${mark(72)}</div>
      <h1 id="obTitle">Pronto.</h1>
      <p class="lead">${st.teams.length} ${st.teams.length === 1 ? "ato" : "atos"}, abas ${st.layout === "side" ? "na lateral" : "em cima"}, tema ${{ brasa: "Brasa", vidro: "Vidro" }[st.theme] || "Grafite"}${st.def ? ", navegador padrão" : ""}. ${st.what.Favoritos ? "Os favoritos do " + st.from + " já estão na barra." : ""}</p>
      <div class="what" style="justify-content:center;margin-top:22px">${st.teams.map(t => `<span class="chip"><span class="logo" style="width:16px;height:16px;font-size:9px;border-radius:4px;background:${t.color}">${letter(t.name)}</span>${esc(t.name)}</span>`).join("")}</div></div>` },
];

function render(dir) {
  const s = STEPS[st.step], body = $("#body");
  body.innerHTML = s.body();
  body.classList.remove("in-r", "in-l"); if (dir) { void body.offsetWidth; body.classList.add(dir); }
  $("#steps").innerHTML = STEPS.map((_, i) => `<i class="${i < st.step ? "done" : i === st.step ? "on" : ""}"></i>`).join("");
  $("#next").textContent = s.next;
  $("#back").textContent = s.alt || "Voltar";
  $("#back").style.visibility = st.step === 0 ? "hidden" : "visible";
  st.draft.pop = false;
  const n = $("#tname"); if (n && document.activeElement === document.body) n.focus();
}
function go(d) { const to = Math.max(0, Math.min(STEPS.length - 1, st.step + d)); if (to === st.step) return; st.step = to; render(d > 0 ? "in-r" : "in-l"); }
function addTeam() {
  const d = st.draft; if (!d.name.trim()) return;
  st.teams.push({ name: d.name.trim(), color: d.color });
  const used = st.teams.map(t => t.color), free = Object.values(PALETTE).find(c => !used.includes(c));
  st.draft = { name: "", color: free || PALETTE.ardosia }; render();
}
function setTheme(v) { st.theme = v; if (v === "brasa" || v === "vidro") document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; document.querySelectorAll("#theme button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); }

$("#next").onclick = () => { if (st.step === 5) st.def = true; if (st.step === STEPS.length - 1) { st.step = 0; return render("in-l"); } go(1); };
$("#back").onclick = () => { if (STEPS[st.step].alt) { if (st.step === 5) st.def = false; if (st.step === 1) Object.keys(st.what).forEach(k => st.what[k] = false); return go(1); } go(-1); };
$("#restart").onclick = () => { st.step = 0; render("in-l"); };
document.addEventListener("click", e => {
  const t = e.target;
  const from = t.closest("[data-from]"); if (from) { st.from = from.dataset.from; return render(); }
  const w = t.closest("[data-what]"); if (w) { st.what[w.dataset.what] = !st.what[w.dataset.what]; return render(); }
  const c = t.closest("[data-color]"); if (c) { st.draft.color = c.dataset.color; st.draft.pop = true; return render(); }
  const rm = t.closest("[data-rm]"); if (rm) { st.teams.splice(+rm.dataset.rm, 1); return render(); }
  if (t.closest("#addTeam")) return addTeam();
  if (t.closest("[data-share]")) { st.share = !st.share; return render(); }
  const l = t.closest("[data-layout]"); if (l) { st.layout = l.dataset.layout; return render(); }
  const th = t.closest("#themeIn [data-v], #theme [data-v]"); if (th) { setTheme(th.dataset.v); if (st.step === 3) render(); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "tname") return;
  st.draft.name = e.target.value;
  $("#prev").textContent = st.draft.name ? letter(st.draft.name) : "?";
  const b = $("#addTeam"); b.disabled = !st.draft.name.trim(); b.style.opacity = b.disabled ? .45 : 1; b.style.cursor = b.disabled ? "default" : "pointer";
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter") { if (e.target.id === "tname") { e.preventDefault(); return st.draft.name.trim() ? addTeam() : go(1); } if (!e.target.closest("button")) $("#next").click(); }
  if (e.key === "Escape") go(-1);
});
render();
</script>
</body>
</html>
